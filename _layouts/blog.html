<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
    <title>{{ page.title }} | {{ site.title }}</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="{{ site.title }}">
    <meta name="keywords" content="{{ site.keywords }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css"
        integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/pub.css">
    <link rel="stylesheet" href="/assets/css/nav.css">

    <script src="/assets/js/github-stars.js"></script>
    <script type="text/javascript" src="/assets/js/jquery.js"></script>

    <script>
        function myFunction() {
            var x = document.getElementById("myLinks");
            if (x.style.display === "inline") {
                x.style.display = "none";
            } else {
                x.style.display = "inline";
            }
        }
    </script>
</head>

<body>

    <div class="topnav">
        <div id="myLinks">
            {% include navigation.md %}
        </div>
        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </a>
    </div>

    <div class="wrapper">

        <section style="width: 100%; float: none; max-width: 800px; margin: 0 auto; padding-top: 40px;">

            <h1>{{ page.title }}</h1>
            <hr>

            {{ content }}

        </section>

        <footer style="width: 100%; float: none; position: static; text-align: center; padding-top: 50px;">
            <div style="font: 12px/1.2 Crimson Pro, serif">
                <p>
                    <small>
                        Copyright © {{ site.title }}
                    </small>
                </p>
            </div>
        </footer>
    </div>

    <script src="{{ " /assets/js/scale.fix.js" | relative_url }}"></script>
</body>

</html>
